apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tektonic-anchore-scan
  namespace: tektonic-ci
spec:
  params:
    - description: Branch or tag ref of the event, bound by PAC from source_branch
      name: source-branch
      type: string
    - description: Repository owner/name, bound by PAC from repo_owner and repo_name
      name: repo-full-name
      type: string
    - description: Commit SHA, bound by PAC from revision
      name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: restore-grype-db-cache
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let hash = ("" | hash sha256 | str substring 0..15)
        $hash | save -f /tekton/home/.cache-grype-db-hash
        if (["grype-db"] | any { |p| $p | path exists }) {
          log $"restore-grype-db-cache: paths already exist, skipping restore ($hash)"
          exit 0
        }
        let archive = $"$(workspaces.cache.path)/($hash).tar.zst"

        if ($archive | path exists) {
          let archive_size = (ls $archive | get size.0)
          log $"restore-grype-db-cache: hit ($hash) size=($archive_size)"
          let t0 = (date now)
          let stage = $".cache-restore-(random uuid)"
          mkdir $stage
          try {
            ^zstd -d -T1 -c $archive | ^tar xf - -C $stage -o --no-same-permissions
          } catch { |e|
            rm -rf $stage
            log $"restore-grype-db-cache: extract failed \(($e.msg)\)"
            exit 1
          }
          for p in ["grype-db"] {
            let staged = ($stage | path join $p)
            if not ($staged | path exists) { continue }
            if ($p | path exists) {
              # Rename the live tree aside and move the new one in — never delete in place. The
              # displaced tree is removed afterwards and best-effort: a concurrent writer still inside
              # it can legitimately make that fail, and by then nothing resolves to it by path.
              let displaced = $"($p).displaced-(random uuid)"
              mv $p $displaced
              mv $staged $p
              try { ^chmod -R u+w $displaced; rm -rf $displaced } catch { |e|
                log $"restore-grype-db-cache: displaced tree ($displaced) not removed: ($e.msg)"
              }
            } else {
              let parent = ($p | path dirname)
              if (($parent | str length) > 0) and ($parent != ".") { mkdir $parent }
              mv $staged $p
            }
          }
          rm -rf $stage
          let elapsed = (((date now) - $t0) | into int) / 1_000_000_000
          log $"restore-grype-db-cache: restored in ($elapsed)s"
        } else {
          log $"restore-grype-db-cache: miss ($hash)"
        }
      workingDir: $(workspaces.workspace.path)
    - image: ghcr.io/pfenerty/apko-cicd/syft:1.51.0
      name: generate-sbom
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        log "generate-sbom: generating SBOM from package-lock.json"
        let start = (date now)

        ^syft file:package-lock.json -o cyclonedx-json=sbom.cyclonedx.json -o syft-table

        let elapsed = ((date now) - $start | into int) / 1_000_000_000
        log $"generate-sbom: done in ($elapsed)s"

        if ("sbom.cyclonedx.json" | path exists) {
          let size = (ls sbom.cyclonedx.json | get size.0)
          log $"generate-sbom: sbom size: ($size)"
        } else {
          log "generate-sbom: warning: sbom.cyclonedx.json not found"
        }
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [anchore-scan/generate-sbom]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - env:
        - name: GRYPE_DB_CACHE_DIR
          value: $(workspaces.workspace.path)/grype-db
      image: ghcr.io/pfenerty/apko-cicd/grype:0.117.0
      name: scan
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        log "grype-scan: scanning sbom.cyclonedx.json for vulnerabilities"
        let start = (date now)

        # Run grype directly so stdout/stderr stream in real time. The step's failure
        # must not stop the pipeline (the SARIF still needs uploading), and its exit
        # code reaches the reporter through the contract file and Tekton's own
        # /tekton/steps/step-scan/exitCode.
        ^grype -v sbom:./sbom.cyclonedx.json -o sarif=./scan.sarif

        let elapsed = ((date now) - $start | into int) / 1_000_000_000
        log $"grype-scan: done in ($elapsed)s"

        if ("scan.sarif" | path exists) {
          let size = (ls scan.sarif | get size.0)
          log $"grype-scan: sarif size: ($size)"
        }
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [anchore-scan/scan]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: upload-sarif
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        if not ("scan.sarif" | path exists) or (ls scan.sarif | get size.0) == 0B {
          log "upload-sarif: no sarif to upload, skipping"
          exit 0
        }

        let ref_raw = "$(params.source-branch)"
        let ref = if ($ref_raw | str starts-with "refs/") { $ref_raw } else { $"refs/heads/($ref_raw)" }
        log $"upload-sarif: ref: ($ref)"

        # Base64-encode the gzipped SARIF
        let sarif_b64 = (open --raw scan.sarif | ^gzip -c | encode base64)
        log $"upload-sarif: payload: (($sarif_b64 | str length) / 1024 | math round)KB base64"

        let url = "https://api.github.com/repos/$(params.repo-full-name)/code-scanning/sarifs"
        let body = {
          commit_sha: "$(params.revision)",
          ref: $ref,
          sarif: $sarif_b64,
        }

        log $"upload-sarif: POST ($url)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "upload-sarif: uploaded"
        } catch { |e|
          log $"upload-sarif: upload failed: ($e.msg)"
        }
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [anchore-scan/upload-sarif]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: save-grype-db-cache
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let hash = (try { open --raw /tekton/home/.cache-grype-db-hash | str trim } catch { "" })
        if ($hash | is-empty) { log "save-grype-db-cache: no hash, skipping"; exit 0 }

        let archive = $"$(workspaces.cache.path)/($hash).tar.zst"

        let paths = ["grype-db"] | where { |p| ($p | path exists) }
        if ($paths | is-empty) { log "save-grype-db-cache: no paths to cache"; exit 0 }

        for p in $paths { ^chmod -R u+w $p }

        let max = 1
        if $max > 0 {
          let entries = (try { ls $(workspaces.cache.path)/*.tar.zst | sort-by modified | reverse | skip $max } catch { [] })
          for e in $entries { log $"save-grype-db-cache: evicting ($e.name | path basename)"; rm $e.name }
        }

        let uncompressed = ($paths | each { |p| try { du $p | get apparent.0 | into int } catch { 0 } } | math sum)
        log $"save-grype-db-cache: compressing (($uncompressed / 1_000_000) | math round --precision 1)MB uncompressed ..."
        let t0 = (date now)
        # Write to a temp path and rename into place: a step killed mid-write (OOM, eviction,
        # timeout) must never leave a truncated archive at the real hash-keyed path, since the
        # skip-if-exists guard above means a corrupt archive there would never self-heal.
        let tmp = $"($archive).tmp.(random uuid)"
        # nushell aborts the enclosing block as soon as any external command in the pipe
        # reports a non-zero exit (e.g. tar failing to read one of $paths), so cleanup must
        # live in a catch — code placed after the pipe but outside try/catch never runs.
        try {
          ^tar cf - ...$paths | ^zstd -1 -T1 -f -o $tmp
        } catch { |e|
          rm -f $tmp
          log $"save-grype-db-cache: compress failed (($e.msg)), discarding partial archive"
          exit 1
        }
        mv -f $tmp $archive
        let elapsed = (((date now) - $t0) | into int) / 1_000_000_000
        let compressed = (ls $archive | get size.0)
        let ratio = ($uncompressed / ($compressed | into int) | math round --precision 1)
        log $"save-grype-db-cache: saved ($compressed) ratio=($ratio)x in ($elapsed)s"
      workingDir: $(workspaces.workspace.path)
    - env: []
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        # A step that never ran has no file; 0 keeps it out of the max.
        let step_codes = ([{ name: "generate-sbom", path: "/tekton/steps/step-generate-sbom/exitCode" } { name: "scan", path: "/tekton/steps/step-scan/exitCode" } { name: "upload-sarif", path: "/tekton/steps/step-upload-sarif/exitCode" }] | each { |s| { name: $s.name, code: (try { open --raw $s.path | str trim | into int } catch { 0 }) } })
        let exit_code = ([$contract_code ...($step_codes | each { |s| $s.code })] | math max)
        let state = if $exit_code == 0 { "success" } else { "failure" }
        # Name the first step that failed, so the check says where without opening the logs.
        let failed_steps = ($step_codes | where code != 0)
        let desc = if $exit_code == 0 {
          "Passed"
        } else if ($failed_steps | is-empty) {
          $"Failed: exit ($exit_code)"
        } else {
          let first = ($failed_steps | first)
          $"Failed: step ($first.name) exited ($first.code)"
        }

        log $"report-status [anchore-scan]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "anchore-scan", description: $desc }

        log $"report-status [anchore-scan]: POST ($url)"
        log $"report-status [anchore-scan]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [anchore-scan]: done"
        } catch { |e|
          log $"report-status [anchore-scan]: error: ($e.msg)"
        }
        exit $exit_code
  workspaces:
    - name: cache
    - name: workspace
