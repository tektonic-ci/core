apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tektonic-build-npm
  namespace: tektonic-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: restore-npm-cache
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let hash = (
          ["package-lock.json"]
          | each { |f| if ($f | path exists) { open --raw $f } else { "" } }
          | str join | hash sha256 | str substring 0..15
        )
        $hash | save -f /tekton/home/.cache-npm-hash
        if (["node_modules"] | any { |p| $p | path exists }) {
          log $"restore-npm-cache: paths already exist, skipping restore ($hash)"
          exit 0
        }
        let archive = $"$(workspaces.cache.path)/($hash).tar.zst"

        if ($archive | path exists) {
          let archive_size = (ls $archive | get size.0)
          log $"restore-npm-cache: hit ($hash) size=($archive_size)"
          let t0 = (date now)
          let stage = $".cache-restore-(random uuid)"
          mkdir $stage
          try {
            ^zstd -d -T1 -c $archive | ^tar xf - -C $stage -o --no-same-permissions
          } catch { |e|
            rm -rf $stage
            log $"restore-npm-cache: extract failed \(($e.msg)\)"
            exit 1
          }
          for p in ["node_modules"] {
            let staged = ($stage | path join $p)
            if not ($staged | path exists) { continue }
            if ($p | path exists) {
              # Rename the live tree aside and move the new one in — never delete in place. The
              # displaced tree is removed afterwards and best-effort: a concurrent writer still inside
              # it can legitimately make that fail, and by then nothing resolves to it by path.
              let displaced = $"($p).displaced-(random uuid)"
              mv $p $displaced
              mv $staged $p
              try { ^chmod -R u+w $displaced; rm -rf $displaced } catch { |e|
                log $"restore-npm-cache: displaced tree ($displaced) not removed: ($e.msg)"
              }
            } else {
              let parent = ($p | path dirname)
              if (($parent | str length) > 0) and ($parent != ".") { mkdir $parent }
              mv $staged $p
            }
          }
          rm -rf $stage
          let elapsed = (((date now) - $t0) | into int) / 1_000_000_000
          log $"restore-npm-cache: restored in ($elapsed)s"
        } else {
          log $"restore-npm-cache: miss ($hash)"
        }
      workingDir: $(workspaces.workspace.path)
    - image: ghcr.io/pfenerty/apko-cicd/nodejs:24
      name: build
      onError: continue
      script: |-
        #!/bin/sh
        log() { printf '[%s] %s\n' "$(date +%H:%M:%S)" "$*"; }
        [ -e /tekton/home/.exit-code ] || printf '%s' 0 > /tekton/home/.exit-code
        chmod 0666 /tekton/home/.exit-code 2>/dev/null || true
        (
        set -e
        if [ ! -d node_modules ]; then npm ci; fi
        npm run build
        )
        __tek_rc=$?
        if [ "$__tek_rc" -ne 0 ]; then log "error [build-npm/build]: exited with status $__tek_rc"; fi
        __tek_prev=$(cat /tekton/home/.exit-code 2>/dev/null || echo 0)
        if [ "$__tek_rc" -gt "$__tek_prev" ]; then __tek_prev="$__tek_rc"; fi
        printf '%s' "$__tek_prev" > /tekton/home/.exit-code
        exit "$__tek_rc"
      workingDir: $(workspaces.workspace.path)
    - image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: save-npm-cache
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let hash = (try { open --raw /tekton/home/.cache-npm-hash | str trim } catch { "" })
        if ($hash | is-empty) { log "save-npm-cache: no hash, skipping"; exit 0 }

        let archive = $"$(workspaces.cache.path)/($hash).tar.zst"
        if ($archive | path exists) { log $"save-npm-cache: ($hash) exists, skipping"; exit 0 }

        let paths = ["node_modules"] | where { |p| ($p | path exists) }
        if ($paths | is-empty) { log "save-npm-cache: no paths to cache"; exit 0 }

        for p in $paths { ^chmod -R u+w $p }

        let max = 3
        if $max > 0 {
          let entries = (try { ls $(workspaces.cache.path)/*.tar.zst | sort-by modified | reverse | skip $max } catch { [] })
          for e in $entries { log $"save-npm-cache: evicting ($e.name | path basename)"; rm $e.name }
        }

        let uncompressed = ($paths | each { |p| try { du $p | get apparent.0 | into int } catch { 0 } } | math sum)
        log $"save-npm-cache: compressing (($uncompressed / 1_000_000) | math round --precision 1)MB uncompressed ..."
        let t0 = (date now)
        # Write to a temp path and rename into place: a step killed mid-write (OOM, eviction,
        # timeout) must never leave a truncated archive at the real hash-keyed path, since the
        # skip-if-exists guard above means a corrupt archive there would never self-heal.
        let tmp = $"($archive).tmp.(random uuid)"
        # nushell aborts the enclosing block as soon as any external command in the pipe
        # reports a non-zero exit (e.g. tar failing to read one of $paths), so cleanup must
        # live in a catch — code placed after the pipe but outside try/catch never runs.
        try {
          ^tar cf - ...$paths | ^zstd -1 -T1 -o $tmp
        } catch { |e|
          rm -f $tmp
          log $"save-npm-cache: compress failed (($e.msg)), discarding partial archive"
          exit 1
        }
        mv -f $tmp $archive
        let elapsed = (((date now) - $t0) | into int) / 1_000_000_000
        let compressed = (ls $archive | get size.0)
        let ratio = ($uncompressed / ($compressed | into int) | math round --precision 1)
        log $"save-npm-cache: saved ($compressed) ratio=($ratio)x in ($elapsed)s"
      workingDir: $(workspaces.workspace.path)
    - env: []
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        # A step that never ran has no file; 0 keeps it out of the max.
        let step_codes = ([{ name: "build", path: "/tekton/steps/step-build/exitCode" }] | each { |s| { name: $s.name, code: (try { open --raw $s.path | str trim | into int } catch { 0 }) } })
        let exit_code = ([$contract_code ...($step_codes | each { |s| $s.code })] | math max)
        let state = if $exit_code == 0 { "success" } else { "failure" }
        # Name the first step that failed, so the check says where without opening the logs.
        let failed_steps = ($step_codes | where code != 0)
        let desc = if $exit_code == 0 {
          "Passed"
        } else if ($failed_steps | is-empty) {
          $"Failed: exit ($exit_code)"
        } else {
          let first = ($failed_steps | first)
          $"Failed: step ($first.name) exited ($first.code)"
        }

        log $"report-status [build-npm]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "build-npm", description: $desc }

        log $"report-status [build-npm]: POST ($url)"
        log $"report-status [build-npm]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [build-npm]: done"
        } catch { |e|
          log $"report-status [build-npm]: error: ($e.msg)"
        }
        exit $exit_code
  workspaces:
    - name: cache
    - name: workspace
