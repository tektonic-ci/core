name: publish

# Releases are cut by pushing a vX.Y.Z tag. This workflow *stages* each package on npmjs
# through trusted publishing (OIDC): no token is stored anywhere, and each staged tarball
# carries a provenance attestation. Nothing goes live until a maintainer approves the stage
# with 2FA (`npm stage approve`), so push access to the repo alone cannot release anything.
# The trusted publishers are deliberately left without "publish directly"; a plain
# `npm publish` from here gets 403 "OIDC permission denied for this action".
#
# It lives here rather than in the Tekton self-CI pipeline because npm only accepts
# GitHub Actions, GitLab CI/CD and CircleCI as OIDC issuers — a self-hosted cluster
# cannot be a trusted publisher. Everything else (test, build, scan) still runs in Tekton
# on push and pull_request; see .tekton/.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job mint the OIDC token npm exchanges for a short-lived publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # `npm stage` needs npm 11.19 or later. Pin a known npm rather than rely on whichever
      # one the runner's Node bundles.
      - name: Use an npm that supports staged publishing
        run: npm install -g npm@^12.1.0

      - run: npm ci

      # The tag must name the version being published, or a mistagged release would
      # quietly publish whatever happens to be in package.json. The workspace holds core
      # alone (the providers publish from their own repos); the root is private and
      # versionless.
      - name: Check the tag matches every package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          bad=0
          for ws in $(node -p "require('./package.json').workspaces.join(' ')"); do
            version=$(node -p "require('./${ws}/package.json').version")
            if [ "$tag" != "$version" ]; then
              echo "tag ${GITHUB_REF_NAME} does not match ${ws} version ${version}"
              bad=1
            fi
          done
          exit $bad

      - run: npm test

      - run: npm run build

      # Re-running a release workflow is routine, and a version already on the registry
      # cannot be staged again — skip those, per package. Staged versions are not visible to
      # `npm view` until approved, so a re-run before approval stages that package again;
      # reject the extra stage.
      #
      # A prerelease (any version with a `-`, such as 3.0.0-next.0) goes to the `next`
      # dist-tag, where provider CI runs the conformance kit against it; `latest`, and so
      # every plain `npm install`, never moves to one. npm refuses to stage a prerelease
      # without an explicit --tag, and a staged version's tag cannot be changed afterwards.
      - name: Stage
        run: |
          for ws in $(node -p "require('./package.json').workspaces.join(' ')"); do
            name=$(node -p "require('./${ws}/package.json').name")
            version=$(node -p "require('./${ws}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already on the registry, skipping"
              continue
            fi
            tag=latest
            case "$version" in *-*) tag=next ;; esac
            npm stage publish -w "${name}" --access public --provenance --tag "$tag"
          done
